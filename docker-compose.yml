version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: 369-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform369
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: 369-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: 369-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/platform369?schema=public"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: 369-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

  # ═══════════════════════════════════════════════════════════════════════
  # PHASE 4 — Python Accounting & Reporting Service (Mục 3.6, 9.2 spec)
  # Local dev: dùng chung DB với NestJS (không có Read Replica riêng ở local)
  # ═══════════════════════════════════════════════════════════════════════
  accounting-service:
    build:
      context: ./apps/accounting-service
      dockerfile: Dockerfile
    container_name: 369-accounting-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_READ_URL: "postgresql://postgres:postgres@postgres:5432/platform369"
      DATABASE_REPORT_WRITE_URL: "postgresql://postgres:postgres@postgres:5432/platform369"
      REDIS_URL: "redis://redis:6379"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-change-me-internal-api-key}"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/accounting-service:/app

  celery-worker:
    build:
      context: ./apps/accounting-service
      dockerfile: Dockerfile.worker
    container_name: 369-celery-worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_READ_URL: "postgresql://postgres:postgres@postgres:5432/platform369"
      DATABASE_REPORT_WRITE_URL: "postgresql://postgres:postgres@postgres:5432/platform369"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ./apps/accounting-service:/app

  celery-beat:
    build:
      context: ./apps/accounting-service
      dockerfile: Dockerfile.worker
    container_name: 369-celery-beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_READ_URL: "postgresql://postgres:postgres@postgres:5432/platform369"
      DATABASE_REPORT_WRITE_URL: "postgresql://postgres:postgres@postgres:5432/platform369"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ./apps/accounting-service:/app

volumes:
  postgres_data:
